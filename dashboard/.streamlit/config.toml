[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F4F6FB"
secondaryBackgroundColor = "#EEF1F7"
textColor = "#0F172A"
borderColor = "#DCE2EA"
baseRadius = "10px"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Bricolage Grotesque:https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap, sans-serif"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap, monospace"

[theme.sidebar]
backgroundColor = "#0E1B3D"
secondaryBackgroundColor = "#1E3A8A"
textColor = "#E2E8F5"
primaryColor = "#3B82F6"
borderColor = "#24345F"

[server]
headless = true

[browser]
gatherUsageStats = false
